name: MySQL Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create encrypted-transport database dump
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          test -n "$MYSQL_HOST"
          test -n "$MYSQL_DATABASE"
          test -n "$MYSQL_USERNAME"
          BACKUP_FILE="schoolxnow_$(date -u +%Y%m%d_%H%M%S).sql"
          docker run --rm \
            --env MYSQL_PWD \
            mysql:8.4 \
            mysqldump \
              --host="$MYSQL_HOST" \
              --port="${MYSQL_PORT:-3306}" \
              --user="$MYSQL_USERNAME" \
              --ssl-mode=REQUIRED \
              --single-transaction \
              --routines \
              --triggers \
              --no-tablespaces \
              --databases "$MYSQL_DATABASE" \
            > "$BACKUP_FILE"
          gzip "$BACKUP_FILE"
          gzip --test "$BACKUP_FILE.gz"
          echo "BACKUP_FILE=$BACKUP_FILE.gz" >> "$GITHUB_ENV"

      - name: Upload protected backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysql-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
